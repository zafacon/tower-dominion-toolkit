name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release assets
        uses: actions/checkout@v4
        with:
          ref: release-assets
          persist-credentials: false
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test -f "${version}/tower-dominion-toolkit-${version}-melonloader.zip"
          (cd "${version}" && sha256sum -c "tower-dominion-toolkit-${version}-melonloader.zip.sha256")
          gh release create "${version}" \
            "${version}/tower-dominion-toolkit-${version}-melonloader.zip" \
            "${version}/tower-dominion-toolkit-${version}-melonloader.zip.sha256" \
            --verify-tag --title "Tower Dominion Toolkit ${version}" \
            --notes-file "${version}/RELEASE_NOTES.md"
